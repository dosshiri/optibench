<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組合せ最適化ベンチマーク</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --bar: #2a78d6;
  --missing: #f0efec;
  --seq-0: #cde2fb; --seq-1: #9ec5f4; --seq-2: #6da7ec; --seq-3: #3987e5;
  --seq-4: #256abf; --seq-5: #184f95; --seq-6: #0d366b;
  --ink-on-dark: #ffffff; --ink-on-light: #0b0b0b;
  --accent: #2a78d6;
  --better: #1a7f37; --worse: #c4314b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --text-muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --bar: #3987e5; --missing: #2c2c2a;
    --seq-0: #104281; --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf;
    --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #b7d3f6;
    --ink-on-dark: #0b0b0b; --ink-on-light: #f0efec; --accent: #3987e5;
    --better: #4ac26b; --worse: #ff7b8a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
  --text-muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --bar: #3987e5; --missing: #2c2c2a;
  --seq-0: #104281; --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf;
  --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #b7d3f6;
  --ink-on-dark: #0b0b0b; --ink-on-light: #f0efec; --accent: #3987e5;
  --better: #4ac26b; --worse: #ff7b8a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0 0 4px; }
.sub { color: var(--text-secondary); margin: 0 0 20px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tabs button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin-bottom: 16px; }
.note { color: var(--text-secondary); font-size: 13px; margin: 0 0 12px; }
.scroll { overflow-x: auto; }
svg text { fill: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
svg .label { fill: var(--text-primary); }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 10; white-space: nowrap; }
.tip b { font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
summary { cursor: pointer; color: var(--text-secondary); }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);
  margin-top: 8px; flex-wrap: wrap; }
.runbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; font-size: 14px; }
[hidden] { display: none !important; }
.runbar label { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); min-width: 0; max-width: 100%; }
.runbar select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); min-width: 0; max-width: 100%; }
dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 0; font-size: 13px; }
dl.meta dt { color: var(--text-secondary); }
dl.meta dd { margin: 0; overflow-wrap: anywhere; }
code { font-size: 12px; }
table.envdiff { table-layout: fixed; }
table.envdiff th, table.envdiff td { text-align: left; white-space: normal; overflow-wrap: anywhere; vertical-align: top; }
table.envdiff th:first-child { width: 7em; }
.better { color: var(--better); } .worse { color: var(--worse); }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 2px; }
dl.about { margin: 0; font-size: 14px; }
dl.about dt { font-weight: 600; margin-top: 10px; }
dl.about dt:first-child { margin-top: 0; }
dl.about dd { margin: 2px 0 0; color: var(--text-secondary); max-width: 52em; }
</style>
</head>
<body>
<main>
  <h1>組合せ最適化ベンチマーク</h1>
  <p class="sub" id="sub">TSP・ATSP・ATSP-TW・JSSP・ナーススケジューリングに対する代表的解法の手元比較（全手法 1 スレッド・同一制限時間）</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="runbar">
    <label>run <select id="runSel"></select></label>
    <label>比較対象 <select id="cmpSel"></select></label>
    <label id="thrLab">スレッド数 <select id="thrSel"></select></label>
  </div>
  <section class="card">
    <details id="runinfo">
      <summary id="runsum"></summary>
      <div id="runmeta" style="margin-top:8px"></div>
    </details>
  </section>
  <section class="card" id="cmp" hidden>
    <h2 id="t3">run の比較</h2>
    <p class="note" id="n3"></p>
    <div id="cmpenv"></div>
    <div class="scroll" id="cmpmethods"></div>
    <details style="margin-top:12px">
      <summary>インスタンス別の比較</summary>
      <div class="scroll" id="cmpcells"></div>
    </details>
  </section>
  <section class="card">
    <h2 id="t1">手法別の平均ギャップ</h2>
    <p class="note" id="n1"></p>
    <div id="bars"></div>
  </section>
  <section class="card" id="aboutCard" hidden>
    <h2>手法の解説</h2>
    <p class="note">上のグラフの順に並べています。スレッド数だけが違う手法（<code>-4w</code> など）は 1 つにまとめています。</p>
    <dl class="about" id="about"></dl>
  </section>
  <section class="card">
    <h2 id="t2">インスタンス × 手法のギャップ (%)</h2>
    <p class="note" id="n2"></p>
    <div class="scroll" id="heat"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card" id="thr" hidden>
    <details>
      <summary>スレッド数による違いを表示</summary>
      <p class="note" id="n4" style="margin-top:8px"></p>
      <div id="thrtables"></div>
    </details>
  </section>
  <section class="card">
    <details>
      <summary>数値表を表示</summary>
      <div class="scroll" id="table"></div>
    </details>
  </section>
  <p class="note"><a href="index.html" style="color:var(--accent)">ポータル</a> · <a href="literature/index.html" style="color:var(--accent)">関連論文の調査（文献レビュー）</a> · <a href="discussion/index.html" style="color:var(--accent)">結果と文献を踏まえた考察</a></p>
  <p class="note" id="foot"></p>
</main>
<div class="tip" id="tip"></div>
<script src="data.js"></script>
<script>
const NS = "http://www.w3.org/2000/svg";
const BINS = [0.001, 0.5, 1, 2, 5, 10, 20];  // ギャップ (%) の段階
const tip = document.getElementById("tip");
let DATA, current;
const chosen = {}, compare = {}, thrFilter = {};  // 問題ごとに選んだ run・比較対象・スレッド数の絞り込み

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function fmt(v, d = 2) { return v == null ? "—" : Number(v).toFixed(d); }
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function binOf(g) {  // 0 = 最適, 1..6
  if (g <= BINS[0]) return 0;
  for (let i = 1; i < BINS.length; i++) if (g < BINS[i]) return i;
  return 6;
}

function methodStats(P) {
  return P.methods.map(m => {
    const cs = P.cells.filter(c => c.method === m);
    const ok = cs.filter(c => c.mean_gap != null);
    const mean = ok.length ? ok.reduce((a, c) => a + c.mean_gap, 0) / ok.length : null;
    const nopt = ok.filter(c => c.mean_gap <= 1e-9).length;
    // 平均順位: インスタンスごとに平均目的値で順位付け（解なしは最下位）。最大化問題は大きいほど上位
    const sgn = P.sense === "max" ? -1 : 1;
    const ranks = P.instances.map(inst => {
      const mine = cs.find(c => c.instance === inst);
      if (!mine || mine.mean_obj == null) return P.methods.length;
      const others = P.cells.filter(c => c.instance === inst && c.mean_obj != null);
      return 1 + others.filter(c => sgn * (c.mean_obj - mine.mean_obj) < -1e-9).length;
    });
    const rank = ranks.reduce((a, r) => a + r, 0) / ranks.length;
    return { method: m, mean, rank, solved: ok.length, total: P.instances.length, nopt,
             time: cs.reduce((a, c) => a + c.time, 0) / cs.length };
  }).sort(P.display === "value" ? (a, b) => a.rank - b.rank :
    (a, b) => (a.solved !== b.solved) ? b.solved - a.solved : (a.mean ?? 1e9) - (b.mean ?? 1e9));
}

function drawBars(P) {
  const box = document.getElementById("bars"); box.innerHTML = "";
  const st = methodStats(P);
  const W = Math.max(300, box.clientWidth), rowH = 30, left = 104, right = W < 600 ? 120 : 170, top = 8;
  const H = top + st.length * rowH + 24;
  const byRank = P.display === "value";
  const val = s => byRank ? s.rank : s.mean;
  const max = byRank ? P.methods.length : Math.max(1, ...st.map(s => s.mean ?? 0)) * 1.05;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, box);
  const x = v => left + (W - left - right) * v / max;
  const ticks = W < 600 ? 2 : 4;
  for (let i = 0; i <= ticks; i++) {
    const v = max * i / ticks, xx = x(v);
    el("line", { x1: xx, x2: xx, y1: top, y2: H - 20, stroke: i ? "var(--grid)" : "var(--axis)" }, svg);
    el("text", { x: xx, y: H - 4, "text-anchor": "middle" }, svg).textContent = byRank ? v.toFixed(1) + "位" : v.toFixed(v < 10 ? 1 : 0) + "%";
  }
  st.forEach((s, i) => {
    const y = top + i * rowH;
    el("text", { x: left - 8, y: y + rowH / 2 + 4, "text-anchor": "end", class: "label" }, svg).textContent = s.method;
    const w = val(s) == null ? 0 : Math.max(2, x(val(s)) - left);
    el("rect", { x: left, y: y + 7, width: w, height: rowH - 14, rx: 4, fill: "var(--bar)" }, svg);
    const lab = byRank ? fmt(s.rank, 1) + "位" : s.mean == null ? "解なし" : fmt(s.mean) + "%";
    const extra = s.solved < s.total ? `（解なし${s.total - s.solved}問）` : "";
    el("text", { x: left + w + 6, y: y + rowH / 2 + 4 }, svg).textContent = lab + extra;
    const hit = el("rect", { x: 0, y, width: W, height: rowH, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", ev => showTip(ev,
      `<b>${s.method}</b><br>平均順位 ${fmt(s.rank, 1)} 位<br>平均ギャップ ${s.mean == null ? "—" : fmt(s.mean) + "%"}（解あり ${s.solved}/${s.total} 問）` +
      `<br>最良値到達 ${s.nopt} 問<br>平均時間 ${fmt(s.time, 1)} 秒`));
    hit.addEventListener("mouseleave", hideTip);
  });
}

function drawHeat(P) {
  const box = document.getElementById("heat"); box.innerHTML = "";
  const order = methodStats(P).map(s => s.method);
  const cw = 92, ch = 30, left = 90, top = 44;
  const W = left + cw * order.length + 4, H = top + ch * P.instances.length + 4;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, box);
  order.forEach((m, j) => {
    const t = el("text", { x: left + j * cw + cw / 2, y: top - 10, "text-anchor": "middle", class: "label" }, svg);
    t.textContent = m;
  });
  P.instances.forEach((inst, i) => {
    el("text", { x: left - 8, y: top + i * ch + ch / 2 + 4, "text-anchor": "end", class: "label" }, svg).textContent = inst;
    order.forEach((m, j) => {
      const c = P.cells.find(c => c.instance === inst && c.method === m);
      const x0 = left + j * cw, y0 = top + i * ch;
      let fill = "var(--missing)", ink = "var(--text-secondary)", txt = "×";
      if (c && c.mean_gap != null) {
        const b = binOf(c.mean_gap);
        fill = `var(--seq-${b})`;
        ink = b >= 4 ? "var(--ink-on-dark)" : "var(--ink-on-light)";
        txt = P.display === "value" ? String(Math.round(c.mean_obj)) :
          c.mean_gap <= 1e-9 ? "0" : fmt(c.mean_gap, c.mean_gap < 10 ? 2 : 1);
      }
      el("rect", { x: x0 + 1, y: y0 + 1, width: cw - 2, height: ch - 2, rx: 3, fill }, svg);
      const t = el("text", { x: x0 + cw / 2, y: y0 + ch / 2 + 4, "text-anchor": "middle" }, svg);
      t.textContent = txt; t.style.fill = ink;
      const hit = el("rect", { x: x0, y: y0, width: cw, height: ch, fill: "transparent" }, svg);
      hit.addEventListener("mousemove", ev => showTip(ev, c ?
        `<b>${inst} · ${m}</b><br>平均ギャップ ${c.mean_gap == null ? "解なし" : fmt(c.mean_gap) + "%"}` +
        `<br>平均値 ${c.mean_obj ?? "—"} · 最良値 ${c.best ?? "—"}（参照値 ${c.ref ?? "—"}）` +
        (c.lb != null ? `<br>下界 ${c.lb}` : "") +
        `<br>平均時間 ${fmt(c.time, 1)} 秒 · ${c.runs} 試行${c.fails ? `（失敗 ${c.fails}）` : ""}` : "未実行"));
      hit.addEventListener("mouseleave", hideTip);
    });
  });
  const lg = document.getElementById("legend");
  const names = ["最良値", "<0.5%", "<1%", "<2%", "<5%", "<10%", "≥10%"];
  lg.innerHTML = "ギャップ: " + names.map((n, i) => `<i style="background:var(--seq-${i})"></i>${n}`).join(" ") +
    ` <i style="background:var(--missing)"></i>解なし`;
}

// 解法の登録時に書いた解説（data.json の about）を、グラフと同じ順に並べる
function drawAbout(P, R) {
  const about = P.about || {};
  const names = [...new Set(methodStats(P).map(s => ((R && R.solvers) || {})[s.method] ?? s.method))].filter(n => about[n]);
  document.getElementById("aboutCard").hidden = !names.length;
  document.getElementById("about").innerHTML = names.map(n => `<dt>${esc(n)}</dt><dd>${esc(about[n])}</dd>`).join("");
}

function drawTable(P) {
  const rows = P.cells.slice().sort((a, b) =>
    P.instances.indexOf(a.instance) - P.instances.indexOf(b.instance) || (a.mean_gap ?? 1e9) - (b.mean_gap ?? 1e9));
  document.getElementById("table").innerHTML =
    `<table><thead><tr><th>インスタンス</th><th>手法</th><th>平均値</th><th>最良値</th><th>参照値</th><th>平均ギャップ%</th><th>下界</th><th>平均時間(秒)</th><th>試行</th></tr></thead><tbody>` +
    rows.map(c => `<tr><td>${c.instance}</td><td>${c.method}</td><td>${c.mean_obj ?? "—"}</td><td>${c.best ?? "—"}</td><td>${c.ref ?? "—"}</td>` +
      `<td>${fmt(c.mean_gap)}</td><td>${c.lb ?? "—"}</td><td>${fmt(c.time, 1)}</td><td>${c.runs}${c.fails ? "（失敗" + c.fails + "）" : ""}</td></tr>`).join("") +
    `</tbody></table>`;
}

function esc(v) { return String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function short(c) { return c ? c.slice(0, 7) : "?"; }
function runLabel(R) {
  return `${R.started_at.slice(0, 16).replace("T", " ")} · ${R.environment.machine} · ${R.time_limit}秒 · ${short(R.git.commit)}${R.git.dirty ? "*" : ""}`;
}
function threadsText(R) {
  const multi = [...new Set(Object.values(R.threads))].filter(n => n > 1).sort();
  if (!multi.length) return "全手法 1 スレッド";
  return "全手法 1 スレッド（" + multi.map(k => Object.keys(R.threads).filter(m => R.threads[m] === k).join("・") + ` は ${k} スレッド`).join("、") + "）";
}
function envRows(R) {
  const e = R.environment, g = R.git;
  return [
    ["run_id", `<code>${esc(R.run_id)}</code>`],
    ["実行日時 (UTC)", esc(R.started_at) + (R.finished_at ? " 〜 " + esc(R.finished_at) : "") + (R.status !== "complete" ? `（${esc(R.status)}）` : "")],
    ["マシン", esc(e.machine)],
    ["CPU", `${esc(e.cpu)}（${e.cpu_count} 論理 CPU）`],
    ["メモリ", e.memory_gb == null ? "—" : e.memory_gb + " GB"],
    ["OS", esc(e.os)],
    ["Python", esc(e.python)],
    ["パッケージ", Object.entries(e.packages).map(([k, v]) => `${esc(k)} ${esc(v ?? "—")}`).join(", ")],
    ["制限時間", R.time_limit + " 秒"],
    ["並列", `${threadsText(R)}、同時 ${R.workers} ジョブ`],
    ["シード数", Object.entries(R.seeds).map(([m, n]) => `${esc(m)} ${n}`).join(", ")],
    ["コード", `commit <code>${esc(g.commit ?? "不明")}</code>（${esc(g.branch ?? "")}）` + (g.dirty ? `<br>未コミットの変更あり: ${g.dirty_files.map(esc).join(", ")}` : "")],
    ["メモ", esc(R.note) || "—"],
  ];
}
function drawRunInfo(R) {
  document.getElementById("runsum").textContent = `実行環境と条件: ${R.environment.cpu}（${R.environment.cpu_count} CPU）· ${R.time_limit} 秒 · commit ${short(R.git.commit)}${R.git.dirty ? "（未コミット変更あり）" : ""}`;
  document.getElementById("runmeta").innerHTML = `<dl class="meta">` + envRows(R).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("") + `</dl>`;
}

function signed(v, d = 2) {
  if (v == null) return "—";
  const r = Number(v.toFixed(d));
  return (r > 0 ? "+" : r < 0 ? "−" : "±") + Math.abs(r).toFixed(d);
}
function diffCell(d, unit = "", digits = 2, sgn = 1) {  // 小さいほど良い指標の差 (B − A)。sgn = -1 なら大きいほど良い
  if (d == null) return "<td>—</td>";
  const r = Number(d.toFixed(digits)) * sgn;
  const cls = r === 0 ? "" : r < 0 ? "better" : "worse";
  return `<td class="${cls}">${signed(d, digits)}${unit}</td>`;
}
function drawCompare(P, A, B) {
  const box = document.getElementById("cmp");
  if (!B) { box.hidden = true; return; }
  box.hidden = false;
  document.getElementById("n3").innerHTML =
    `A = 表示中の run（${esc(runLabel(A))}）、B = 比較対象（${esc(runLabel(B))}）。差は B − A で、<span class="better">緑</span>は B が良い、<span class="worse">赤</span>は B が悪いことを示します。` +
    "平均は両方の run で解が得られたインスタンスだけで取っています。";
  // 実行環境・条件で異なる項目
  const ra = Object.fromEntries(envRows(A)), rb = Object.fromEntries(envRows(B));
  const skip = new Set(["run_id", "実行日時 (UTC)", "メモ"]);
  const diffs = Object.keys(ra).filter(k => !skip.has(k) && ra[k] !== rb[k]);
  const insts = P.instances.filter(i => (B.instances || []).includes(i));
  const changed = insts.filter(i => A.instance_sha256[i] !== B.instance_sha256[i]);
  document.getElementById("cmpenv").innerHTML = (diffs.length
    ? `<table class="envdiff" style="margin-bottom:12px"><thead><tr><th>異なる項目</th><th>A</th><th>B</th></tr></thead><tbody>` +
      diffs.map(k => `<tr><td>${k}</td><td>${ra[k]}</td><td>${rb[k]}</td></tr>`).join("") + `</tbody></table>`
    : `<p class="note">実行環境・条件・コードは同じです。</p>`) +
    (changed.length ? `<p class="note worse">インスタンスの内容が異なります: ${changed.map(esc).join(", ")}</p>` : "");
  const cellOf = (R, i, m) => R.cells.find(c => c.instance === i && c.method === m);
  const methods = P.methods.filter(m => B.methods.includes(m));
  const byValue = P.display === "value";
  const rows = methods.map(m => {
    const pairs = insts.map(i => [cellOf(A, i, m), cellOf(B, i, m)]);
    const both = pairs.filter(([a, b]) => a && b && a.mean_gap != null && b.mean_gap != null);
    const avg = f => both.length ? both.reduce((s, p) => s + f(p), 0) / both.length : null;
    const ga = avg(([a]) => a.mean_gap), gb = avg(([, b]) => b.mean_gap);
    const ta = avg(([a]) => a.time), tb = avg(([, b]) => b.time);
    const solved = R => pairs.filter(p => p[R] && p[R].mean_gap != null).length;
    return `<tr><td>${esc(m)}</td><td>${solved(0)}/${insts.length}</td><td>${solved(1)}/${insts.length}</td>` +
      `<td>${fmt(ga)}</td><td>${fmt(gb)}</td>${diffCell(ga == null || gb == null ? null : gb - ga)}` +
      `<td>${fmt(ta, 1)}</td><td>${fmt(tb, 1)}</td>${diffCell(ta == null || tb == null ? null : tb - ta, "", 1)}</tr>`;
  });
  const gapName = byValue ? "最良値との差%" : "平均ギャップ%";
  document.getElementById("cmpmethods").innerHTML =
    `<table><thead><tr><th>手法</th><th>解あり A</th><th>解あり B</th><th>${gapName} A</th><th>${gapName} B</th><th>差</th><th>時間 A</th><th>時間 B</th><th>差</th></tr></thead><tbody>` +
    rows.join("") + `</tbody></table>`;
  const crow = [];
  insts.forEach(i => methods.forEach(m => {
    const a = cellOf(A, i, m), b = cellOf(B, i, m);
    if (!a && !b) return;
    const oa = a?.mean_obj ?? null, ob = b?.mean_obj ?? null;
    crow.push(`<tr><td>${esc(i)}</td><td>${esc(m)}</td><td>${oa ?? "×"}</td><td>${ob ?? "×"}</td>` +
      diffCell(oa == null || ob == null ? null : ob - oa, "", byValue ? 1 : 0, P.sense === "max" ? -1 : 1) +
      `<td>${fmt(a?.mean_gap)}</td><td>${fmt(b?.mean_gap)}</td>` +
      diffCell(a?.mean_gap == null || b?.mean_gap == null ? null : b.mean_gap - a.mean_gap) +
      `<td>${fmt(a?.time, 1)}</td><td>${fmt(b?.time, 1)}</td></tr>`);
  }));
  document.getElementById("cmpcells").innerHTML =
    `<table><thead><tr><th>インスタンス</th><th>手法</th><th>平均値 A</th><th>平均値 B</th><th>差</th><th>${gapName} A</th><th>${gapName} B</th><th>差</th><th>時間 A</th><th>時間 B</th></tr></thead><tbody>` +
    crow.join("") + `</tbody></table>`;
}

// 同じ解法を複数のスレッド数で実行した結果を、解法ごとに並べる
function drawThreads(P, R) {
  const groups = {};
  P.methods.forEach(m => {
    const s = (R.solvers || {})[m] ?? m;
    (groups[s] = groups[s] || []).push(m);
  });
  const multi = Object.entries(groups).filter(([, ms]) => ms.length > 1);
  document.getElementById("thr").hidden = !multi.length;
  if (!multi.length) return;
  const byValue = P.display === "value";
  const cellOf = (i, m) => P.cells.find(c => c.instance === i && c.method === m);
  const val = c => c && c.mean_gap != null ? (byValue ? String(Math.round(c.mean_obj)) : fmt(c.mean_gap)) : "×";
  document.getElementById("n4").textContent = (byValue ? `${P.unit}の平均値` : "平均ギャップ (%) ") +
    "と平均時間（秒）。「×」は制限時間内に実行可能解なし。平均は全スレッド数で解が得られたインスタンスのみ。";
  document.getElementById("thrtables").innerHTML = multi.map(([s, ms]) => {
    ms = ms.slice().sort((a, b) => (R.threads[a] ?? 1) - (R.threads[b] ?? 1));
    const head = ms.map(m => `<th>${R.threads[m] ?? 1} スレッド</th><th>時間</th>`).join("");
    const rows = P.instances.map(i => `<tr><td>${esc(i)}</td>` +
      ms.map(m => { const c = cellOf(i, m); return `<td>${val(c)}</td><td>${c ? fmt(c.time, 1) : "—"}</td>`; }).join("") + "</tr>");
    const both = P.instances.filter(i => ms.every(m => { const c = cellOf(i, m); return c && c.mean_gap != null; }));
    const avg = (m, k) => both.length ? both.reduce((a, i) => a + cellOf(i, m)[k], 0) / both.length : null;
    rows.push(`<tr><td>平均（${both.length} 問${byValue ? "、最良値との差 %" : ""}）</td>` + ms.map(m =>
      `<td>${fmt(avg(m, "mean_gap"))}</td><td>${fmt(avg(m, "time"), 1)}</td>`).join("") + "</tr>");
    return `<h3 style="font-size:14px;margin:12px 0 4px">${esc(s)}</h3><div class="scroll"><table><thead><tr><th>インスタンス</th>${head}</tr></thead><tbody>` +
      rows.join("") + `</tbody></table></div>`;
  }).join("");
}

function fillSelect(sel, ids, value, none) {
  sel.innerHTML = (none ? `<option value="">なし</option>` : "") +
    ids.slice().reverse().map(id => `<option value="${esc(id)}">${esc(runLabel(DATA.runs[id]))}</option>`).join("");
  sel.value = value || "";
}

function render(key) {
  current = key;
  const Pm = DATA.problems[key];
  const runs = Pm.runs || [];
  if (!chosen[key]) chosen[key] = Pm.run;
  const R = DATA.runs ? DATA.runs[chosen[key]] : null;
  const P = R ? Object.assign({}, R, Pm) : Pm;  // 旧形式の data.json（runs なし）にも対応
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === key));
  if (R) {
    fillSelect(document.getElementById("runSel"), runs, chosen[key], false);
    const others = runs.filter(id => id !== chosen[key]);
    if (compare[key] && !others.includes(compare[key])) compare[key] = "";
    fillSelect(document.getElementById("cmpSel"), others, compare[key], true);
    document.getElementById("cmpSel").disabled = !others.length;
    drawRunInfo(R);
  }
  document.querySelector(".runbar").hidden = !R;
  document.getElementById("runinfo").parentElement.hidden = !R;
  const byValue = P.display === "value";
  document.getElementById("t1").textContent = `${P.label}: ` + (byValue ? "手法別の平均順位" : "手法別の平均ギャップ");
  document.getElementById("t2").textContent = byValue ? `インスタンス × 手法の${P.unit}` : "インスタンス × 手法のギャップ (%)";
  document.getElementById("n2").textContent = (byValue
    ? `セルの値は${P.unit}の平均値（小さいほど良い）。色は全 run・全手法中の最良値からの差 (%) を示します。`
    : "セルの値は参照値に対する平均ギャップ (%)。") + "「×」は制限時間内に実行可能解が得られなかったことを示します。";
  document.getElementById("n1").textContent =
    `参照値: ${P.ref}。制限時間 ${P.time_limit} 秒、${R ? threadsText(R) : "全手法 1 スレッド（-4w は 4 スレッド）"}。確率的手法は複数シードの平均。`;
  // スレッド数で絞り込む（run に複数のスレッド数があるときだけ選べる）
  const counts = R ? [...new Set(P.methods.map(m => R.threads[m] ?? 1))].sort((a, b) => a - b) : [];
  const thrSel = document.getElementById("thrSel");
  if (!counts.includes(Number(thrFilter[key]))) thrFilter[key] = "";
  thrSel.innerHTML = `<option value="">すべて</option>` + counts.map(t => `<option value="${t}">${t} スレッド</option>`).join("");
  thrSel.value = thrFilter[key];
  document.getElementById("thrLab").hidden = counts.length < 2;
  let V = P;
  if (thrFilter[key]) {
    const keep = P.methods.filter(m => (R.threads[m] ?? 1) === Number(thrFilter[key]));
    V = Object.assign({}, P, { methods: keep, cells: P.cells.filter(c => keep.includes(c.method)) });
  }
  drawBars(V); drawAbout(V, R); drawHeat(V); drawTable(V);
  if (R) drawThreads(P, R);
  if (R) drawCompare(P, R, compare[key] ? DATA.runs[compare[key]] : null);
  try { localStorage.setItem("tab", key); } catch (e) {}
}
document.getElementById("runSel").onchange = e => { chosen[current] = e.target.value; render(current); };
document.getElementById("thrSel").onchange = e => { thrFilter[current] = e.target.value; render(current); };
document.getElementById("cmpSel").onchange = e => { compare[current] = e.target.value; render(current); };

// data.js があればそれを使う（ダブルクリックで file:// として開いた場合も表示できる）
(window.OPTIBENCH_DATA ? Promise.resolve(window.OPTIBENCH_DATA) : fetch("data.json").then(r => r.json())).then(d => {
  DATA = d;
  const tabs = document.getElementById("tabs");
  Object.entries(d.problems).forEach(([k, P]) => {
    const b = document.createElement("button");
    b.textContent = P.label; b.dataset.k = k; b.setAttribute("role", "tab");
    b.onclick = () => render(k); tabs.appendChild(b);
  });
  // 問題名は登録されている問題から作る（表示名の括弧書きは省く）
  document.getElementById("sub").textContent = Object.values(d.problems).map(P => P.label.split("（")[0]).join("・") +
    "に対する代表的解法の手元比較（同一制限時間・スレッド数を明示して比較）";
  document.getElementById("foot").textContent = `データ生成: ${d.generated}` + (d.env ? `（Python ${d.env.python}, ${d.env.machine}）` : "");
  let first = Object.keys(d.problems)[0];
  try { const s = localStorage.getItem("tab"); if (s && d.problems[s]) first = s; } catch (e) {}
  render(first);
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => current && render(current), 150); });
</script>
</body>
</html>
